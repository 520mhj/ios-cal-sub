name: Build & Deploy Calendars

# 每天自动重建:国务院新公告 → holiday-cn 更新 → 订阅端自动跟进
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 站点地址与访问密钥走仓库 Variables/Secrets,与 calendars.yaml 解耦:
    #   Secret    CAL_EDITOR_KEY     访问密钥 UUID 原样(pnpm cal:key 生成)
    #   Variable  CAL_SITE_BASE_URL  例: https://520mhj.github.io/ios-cal-sub
    #   Variable  CAL_EDITOR_HINT    锁屏提示语(可选)
    env:
      CAL_SITE_BASE_URL: ${{ vars.CAL_SITE_BASE_URL }}
      CAL_EDITOR_KEY: ${{ secrets.CAL_EDITOR_KEY }}
      CAL_EDITOR_HINT: ${{ vars.CAL_EDITOR_HINT }}
    steps:
      - uses: actions/checkout@v4

      # 诊断:确认 Variables/Secrets 是否真的到达了构建环境
      # (Secret 的值会被 GitHub 自动打码为 ***,只看是否为 SET)
      - name: Diagnose config injection
        run: |
          echo "CAL_SITE_BASE_URL = [${{ vars.CAL_SITE_BASE_URL }}]"
          if [ -n "${{ secrets.CAL_EDITOR_KEY }}" ]; then
            echo "CAL_EDITOR_KEY    = [SET]"
          else
            echo "CAL_EDITOR_KEY    = [(empty)]"
          fi
          echo "CAL_EDITOR_HINT   = [${{ vars.CAL_EDITOR_HINT }}]"

      - uses: pnpm/action-setup@v4 # 版本读自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest holiday data
        run: pnpm cal:fetch

      - name: Build .ics calendars
        run: pnpm cal:build

      - name: Verify generated calendars
        run: pnpm cal:verify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
