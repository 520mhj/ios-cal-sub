# ============================================================
# iOS 日历订阅生成器 · 配置文件
#
# 改完运行:  pnpm cal:build   (生成 dist/*.ics)
# 数据更新:  pnpm cal:fetch   (拉最新节假日公告,再 cal:build)
# ============================================================

# 部署后的站点地址(不含末尾斜杠)。用于 index.html 里的 webcal:// 链接。
# 例: https://yourname.github.io/ios-cal-sub   本地预览可留空
site_base_url: ""

# 在线编辑器(/editor/)访问门禁:运行 pnpm cal:key 生成,把 key_sha256 粘贴到下面
# editor_auth:
#   key_sha256: "64位十六进制SHA-256"
#   hint: "找不回密钥?联系站长"   # 公开可见,别写敏感内容

defaults:
  timezone: Asia/Shanghai
  # 向未来展开几年(建议 ≥1;iOS 订阅同步窗口有限,2 年稳妥)
  years_ahead: 2

calendars:
  # ---------- 1. 中国法定节假日 + 调休补班(Apple 日历缺失的部分) ----------
  - id: cn-holidays
    name: 🇨🇳 中国节假日与调休
    description: 法定节假日休息日 + 调休补班提醒
    sources:
      - type: holidays-cn
        include_rest_days: true   # 放假的日子
        include_workdays: true    # 周末补班的日子(重点!)

  # ---------- 2. 农历生日 / 纪念日 ----------
  - id: family-days
    name: 🎂 家人生日与纪念日
    description: 农历自动换算公历,逐年展开
    sources:
      # 示例:农历八月十五过生日的家人(改成你的真实数据)
      - type: lunar
        title: 妈妈·生日
        lunar_month: 8          # 农历八月
        lunar_day: 15           # 十五
        birth_year: 1965        # 可选:公历出生年份 → 描述里显示虚岁
        kind: birthday          # birthday | memorial
        alarm_days_before: [1]  # 提前 1 天全天提醒(也可用 alarms: ["-P2D"] 等自由组合)

      - type: lunar
        title: 爷爷·忌日
        lunar_month: 3
        lunar_day: 9
        kind: memorial

      # 固定公历日期的纪念日
      - type: solar
        title: 结婚纪念日
        month: 10
        day: 2
        alarm_days_before: [7]

      # 每年固定节日也可以放这里,比如父亲节这种"几月第几个星期几"可先用 solar 近似或等后续版本支持

  # ---------- 4. 节气提醒(公历日期每年浮动,自动天文换算) ----------
  - id: jieqi-notes
    name: ⛅ 节气提醒
    description: 二十四节气锚定,支持前一天预告与连续多天打卡
    sources:
      # 场景一:处暑"前一天"晚上提醒,明天要做的事
      - type: solar-term
        title: 明天处暑·把凉席收起来换秋被
        term: 处暑
        offset_days: -1      # 节气前一天
        time: "20:30"        # 当晚 20:30 弹提醒
        alarms: ["-PT15M"]

      # 场景二:从处暑当天起,连续 3 天早晨的时段提醒
      - type: solar-term
        title: 处暑晨跑·趁凉快出门
        term: 处暑
        offset_days: 0       # 从处暑当天开始
        days: 3              # 连续 3 天,每天一条事件
        time: "06:40"
        alarms: ["-PT10M"]

      # 场景三:冬至当天中午的固定动作
      - type: solar-term
        title: 冬至·记得吃饺子
        term: 冬至
        time: "11:00"
        alarms: ["-PT1H"]

      # 场景四:立秋前一天晚上,提前准备第二天的"贴秋膘"
      - type: solar-term
        title: 明天立秋·买菜备菜贴秋膘
        term: 立秋
        offset_days: -1
        time: "19:00"

      # 场景五:白露起连续 3 天,早晚添衣提醒(全天事件+提前1天)
      - type: solar-term
        title: 白露已至·早晚记得添衣
        term: 白露
        days: 3
        alarm_days_before: [0]   # 当天全天横幅提醒

      # 更多写法示例(按需复制):
      # - type: solar-term
      #   title: 清明踏青·查天气订门票
      #   term: 清明
      #   offset_days: -3     # 提前 3 天开始准备
      #   time: "12:00"
      #
      # - type: solar-term
      #   title: 夏至· shortest 白昼打卡
      #   term: 夏至
      #   days: 2

      # 更多节气写法示例(按需复制):
      # - type: solar-term
      #   title: 冬至吃饺子
      #   term: 冬至         # 24 节气名任选:立春…大寒
      #   time: "11:00"
      #
      # - type: solar-term
      #   title: 立秋贴秋膘
      #   term: 立秋
      #   offset_days: 0
      #   days: 2

  # ---------- 3. 自定义周期事件 ----------
  - id: recurring
    name: ⏰ 固定循环事项
    sources:
      - type: rule
        title: 信用卡还款日
        freq: monthly     # weekly | monthly | yearly | once
        day: 25           # 每月 25 号(当月没有 25 号不可能;31 号会贴到月末)
        time: "09:00"     # 定时事件(默认为全天);时区取 defaults.timezone
        alarms: ["-P1D", "-PT1H"]

      - type: rule
        title: 垃圾分类·周四晚上倒
        freq: weekly
        weekday: thu      # mon tue wed thu fri sat sun
        time: "19:30"

      - type: rule
        title: 车辆年检截止
        freq: yearly
        month: 6
        day: 30
        alarm_days_before: [14, 1]
        end: "2028-12-31" # 只提醒到 2028 年

# 更多写法示例(按需复制):
#   - type: rule
#     title: 项目上线
#     freq: once
#     date: "2026-03-15"
#     time: "10:00"
