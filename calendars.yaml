      - type: "holidays-cn"
        include_rest_days: true
        include_workdays: true
      - type: "lunar-festival"
        title: "元宵节"
        festival: "元宵节"
      - type: "lunar-festival"
        title: "龙抬头"
        festival: "龙抬头"
      - type: "lunar-festival"
        title: "上巳节"
        festival: "上巳节"
      - type: "lunar-festival"
        title: "七夕节"
        festival: "七夕节"
      - type: "lunar-festival"
        title: "中元节"
        festival: "中元节"
      - type: "lunar-festival"
        title: "中秋节"
        festival: "中秋节"
      - type: "lunar-festival"
        title: "重阳节"
        festival: "重阳节"
      - type: "lunar-festival"
        title: "寒衣节"
