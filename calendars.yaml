# ============================================================
# ios-cal-sub · 公开示例配置
# ============================================================
# 此文件只包含公开日历(cn-holidays),fork 者拿到代码即有一个可用的
# 中国节假日与调休日历。
#
# 私人日历(生日、纪念日、打卡、循环事项等)不写在此文件中,
# 而是存储在 Cloudflare KV 中,通过在线编辑器(/editor/)管理。
# 这样公开仓库中不会泄露任何私人信息。
#
# 本地构建(pnpm cal:build)仍会读取此文件,用于离线验证和开发。
# ============================================================

site_base_url: ""
defaults:
  timezone: "Asia/Shanghai"
  years_ahead: 2
  timezone_emoji: true

calendars:
  - id: "cn-holidays"
    name: "🇨🇳 中国节假日与调休"
    description: "法定节假日休息日 + 调休补班提醒 + 传统节日 + 二十四节气"
    sources:
      - type: "holidays-cn"
        include_rest_days: true
        include_workdays: true
      - type: "lunar-festival"
        title: "元宵节"
        festival: "元宵节"
      - type: "lunar-festival"
        title: "龙抬头"
        festival: "龙抬头"
      - type: "lunar-festival"
        title: "上巳节"
        festival: "上巳节"
      - type: "lunar-festival"
        title: "七夕节"
        festival: "七夕节"
      - type: "lunar-festival"
        title: "中元节"
        festival: "中元节"
      - type: "lunar-festival"
        title: "重阳节"
        festival: "重阳节"
      - type: "lunar-festival"
        title: "寒衣节"
        festival: "寒衣节"
      - type: "lunar-festival"
        title: "下元节"
        festival: "下元节"
      - type: "lunar-festival"
        title: "腊八节"
        festival: "腊八节"
      - type: "lunar-festival"
        title: "小年(北方)"
        festival: "小年(北方)"
      - type: "lunar-festival"
        title: "小年(南方)"
        festival: "小年(南方)"
      - type: "lunar-festival"
        title: "除夕"
        festival: "除夕"
      - type: "solar-terms"
    access: "public"
