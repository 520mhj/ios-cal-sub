site_base_url: ""
defaults:
  timezone: "Asia/Shanghai"
  years_ahead: 2
  timezone_emoji: true
calendars:
  - id: "cn-holidays"
    name: "🇨🇳 中国节假日与调休"
    description: "法定节假日休息日 + 调休补班提醒"
    sources:
      - type: "holidays-cn"
        include_rest_days: true
        include_workdays: true
  - id: "family-days"
    name: "🎂 家人生日与纪念日"
    description: "农历自动换算公历,逐年展开"
    sources:
      - type: "lunar"
        title: "妈妈·生日"
        alarm_days_before:
          - 1
        lunar_month: 8
        lunar_day: 15
        birth_year: 1965
        kind: "birthday"
      - type: "solar"
        title: "结婚纪念日"
        alarm_days_before:
          - 7
        month: 10
        day: 2
  - id: "jieqi-notes"
    name: "⛅ 节气提醒"
    description: "二十四节气锚定,支持前一天预告与连续多天打卡"
    sources:
      - type: "solar-term"
        title: "明天春分·扳指见龙脊"
        time: "10:30"
        alarms:
          - "-PT15M"
        term: "春分"
        offset_days: -1
        days: 90
        alarm_days_before:
          - 1
      - type: "solar-term"
        title: "端午节·凤交颈·36下"
        time: "10:20"
        alarms:
          - "-PT1H"
        term: "夏至"
        offset_days: 2
        days: 90
        alarm_days_before:
          - 0
      - type: "solar-term"
        title: "处暑打虫·服用菊桂化骨散"
        time: "16:00"
        alarms:
          - "-PT10M"
        term: "处暑"
        offset_days: 0
        days: 5
        alarm_days_before:
          - 1
  - id: "recurring"
    name: "⏰ 固定循环事项"
    sources:
      - type: "rule"
        title: "每月必做"
        note: "爸爸200花费、两个手机卡各50、家里电费各100"
        time: "19:40"
        alarms:
          - "-P1D"
          - "-PT1H"
        alarm_days_before:
          - 0
        freq: "monthly"
        day: 15