site_base_url: ""
defaults:
  timezone: "Asia/Shanghai"
  years_ahead: 2
  timezone_emoji: true
calendars:
  - id: "cn-holidays"
    name: "🇨🇳 中国节假日与调休"
    description: "法定节假日休息日 + 调休补班提醒"
    sources:
      - type: "holidays-cn"
        include_rest_days: true
        include_workdays: true
  - id: "family-days"
    name: "🎂 家人生日与纪念日"
    description: "农历自动换算公历,逐年展开"
    sources:
      - type: "lunar"
        title: "妈妈·生日"
        alarm_days_before:
          - 1
        lunar_month: 8
        lunar_day: 15
        birth_year: 1965
        kind: "birthday"
      - type: "solar"
        title: "结婚纪念日"
        alarm_days_before:
          - 7
        month: 10
        day: 2
  - id: "jieqi-notes"
    name: "⛅ 节气提醒"
    description: "二十四节气锚定,支持前一天预告与连续多天打卡"
    sources:
      - type: "solar-term"
        title: "明天处暑·把凉席收起来换秋被"
        time: "20:30"
        alarms:
          - "-PT15M"
        term: "处暑"
        offset_days: -1
        days: 1
      - type: "solar-term"
        title: "处暑打虫·趁凉快出门"
        time: "16:00"
        alarms:
          - "-PT10M"
        term: "处暑"
        offset_days: 0
        days: 5
      - type: "solar-term"
        title: "冬至·记得吃饺子"
        time: "11:00"
        alarms:
          - "-PT1H"
        term: "冬至"
        offset_days: 0
        days: 1
      - type: "solar-term"
        title: "明天立秋·买菜备菜贴秋膘"
        time: "19:00"
        term: "立秋"
        offset_days: -1
        days: 1
      - type: "solar-term"
        title: "白露已至·早晚记得添衣"
        alarm_days_before:
          - 0
        term: "白露"
        offset_days: 0
        days: 3
  - id: "recurring"
    name: "⏰ 固定循环事项"
    sources:
      - type: "rule"
        title: "每月必做"
        time: "19:40"
        alarms:
          - "-P1D"
          - "-PT1H"
        freq: "monthly"
        note: "爸爸200花费、两个手机卡各50、家里电费各100"
        alarm_days_before:
          - 0
        day: 15
    description: null