name = "ios-cal-sub"
main = "src/worker.ts"
compatibility_date = "2024-09-01"

# ============================================================
# KV 命名空间:存储私人日历配置
# 创建步骤:
#   1. wrangler kv namespace create CAL_KV
#   2. 把返回的 id 填到下面
#   3. fork 者需要创建自己的命名空间并替换 id
# ============================================================
[[kv_namespaces]]
binding = "CAL_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 非敏感变量(可公开进仓库)
[vars]
SITE_NAME = "iOS 日历订阅"

# ============================================================
# 静态资源目录:qrcode.min.js、编辑器页面等
# Worker 处理动态路由(.ics、/api/*、/),静态文件由此目录托管
# ============================================================
[assets]
directory = "public"

# ============================================================
# 敏感变量用 `wrangler secret put` 设置,绝不写进此文件:
#
#   wrangler secret put EDITOR_KEY_SHA256
#     值: UUID 密钥的 SHA-256 十六进制(64位小写)
#     生成: echo -n "你的UUID" | sha256sum
#     用途: 解锁在线编辑器 + 派生私密订阅令牌
#
# fork 者必须配置自己的 EDITOR_KEY_SHA256,否则编辑器和私密日历不可用。
# ============================================================
