name = "ios-cal-sub"
main = "src/worker.ts"
compatibility_date = "2024-09-01"

# ============================================================
# KV 命名空间(用于存储私人日历配置)
#
# 只写 binding,不写 id —— 部署时 Cloudflare 自动创建 namespace 并绑定
# (wrangler@4.45.0+ 的 Automatic resource provisioning 功能)
#
# 首次部署后,Cloudflare 会自动把 namespace id 回写到此文件;
# 即使不写回,后续部署也会保持绑定,不会丢失。
#
# 不配置 KV 时:公开日历(cn-holidays)正常可用,私人日历/编辑器功能不可用。
# ============================================================
[[kv_namespaces]]
binding = "CAL_KV"

# 非敏感变量(可公开进仓库)
[vars]
SITE_NAME = "iOS 日历订阅"

# ============================================================
# 静态资源已内联到 Worker 中(src/assets.generated.ts),
# 由 pnpm build:assets 从 public/ 目录生成。
# 不使用 wrangler [assets] 功能,兼容 wrangler 3.x/4.x 和 Git 集成部署。
# ============================================================

# ============================================================
# 敏感变量在 Cloudflare Dashboard 中设置:
#   Worker → Settings → Variables and Secrets → Add variable/secret
#
#   EDITOR_KEY (Secret 类型)
#     值: UUID 访问密钥(原样,非哈希)
#     生成: https://uuidgenerator.dev 或 pnpm cal:key
#     用途: 解锁在线编辑器 + 派生私密订阅令牌
#     安全: Secret 加密存储,Worker 运行时才能读取;不进代码、不进仓库
#
#   SITE_BASE_URL (Variable 类型,可选)
#     值: 你的 Worker 域名,如 https://ios-cal-sub.xxx.workers.dev
# ============================================================
