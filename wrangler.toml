name = "ios-cal-sub"
main = "src/worker.ts"
compatibility_date = "2024-09-01"

# ============================================================
# KV 命名空间(可选,用于存储私人日历配置)
#
# 方式一:Cloudflare Dashboard 中添加(推荐,无需改代码)
#   Worker → Settings → Bindings → Add binding → KV
#   Variable name: CAL_KV
#   Namespace: 选择已有的,或点 "Create a namespace" 新建(名称随意)
#
# 方式二:wrangler CLI 创建并写死 id
#   npx wrangler kv namespace create CAL_KV
#   把返回的 id 填到下面,然后取消注释
#
# 不配置 KV 时:公开日历(cn-holidays)正常可用,私人日历/编辑器功能不可用。
# ============================================================
# [[kv_namespaces]]
# binding = "CAL_KV"
# id = "你的_KV_namespace_id"

# 非敏感变量(可公开进仓库)
[vars]
SITE_NAME = "iOS 日历订阅"

# ============================================================
# 静态资源目录:qrcode.min.js、编辑器页面等
# Worker 处理动态路由(.ics、/api/*、/),静态文件由此目录托管
# ============================================================
[assets]
directory = "public"

# ============================================================
# 敏感变量在 Cloudflare Dashboard 中设置:
#   Worker → Settings → Variables and Secrets → Add variable/secret
#
#   EDITOR_KEY_SHA256 (Secret 类型)
#     值: UUID 密钥的 SHA-256 十六进制(64位小写)
#     生成: echo -n "你的UUID" | sha256sum
#     用途: 解锁在线编辑器 + 派生私密订阅令牌
#
#   SITE_BASE_URL (Variable 类型,可选)
#     值: 你的 Worker 域名,如 https://ios-cal-sub.xxx.workers.dev
# ============================================================
